<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d5a6b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4ecdc4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#26a69a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tree" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#27ae60;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="url(#sky)"/>
  
  <!-- Waterfall streams -->
  <path d="M32 14 Q35 24 32 34 Q29 44 32 54" stroke="url(#water)" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M26 18 Q28 28 25 38 Q23 48 26 54" stroke="url(#water)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M38 18 Q36 28 39 38 Q41 48 38 54" stroke="url(#water)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
  
  <!-- Pool at bottom -->
  <ellipse cx="32" cy="55" rx="16" ry="4" fill="url(#water)" opacity="0.6"/>
  
  <!-- Single tree on the left -->
  <rect x="10" y="22" width="4" height="14" rx="2" fill="#6d4c41"/>
  <circle cx="12" cy="16" r="8" fill="url(#tree)"/>
  <circle cx="7" cy="20" r="5" fill="url(#tree)"/>
  <circle cx="17" cy="20" r="5" fill="url(#tree)"/>
  
  <!-- Water sparkles -->
  <circle cx="32" cy="24" r="1.5" fill="white" opacity="0.8"/>
  <circle cx="30" cy="40" r="1" fill="white" opacity="0.6"/>
</svg>
