    <!-- Robotic arm base -->
    <rect x="40" y="75" width="20" height="10" rx="2" fill="#4ade80" opacity="0.3"/>
    <!-- Arm segment 1 -->
    <path d="M50 75 L50 55" stroke-width="4"/>
