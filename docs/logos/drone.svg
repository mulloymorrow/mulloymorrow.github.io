<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Drone body (center) -->
  <rect x="9" y="10" width="6" height="4" rx="1" fill="currentColor" stroke="none"/>
  
  <!-- Arms extending to rotors -->
  <line x1="9" y1="12" x2="4" y2="7"/>
  <line x1="15" y1="12" x2="20" y2="7"/>
  <line x1="9" y1="12" x2="4" y2="17"/>
  <line x1="15" y1="12" x2="20" y2="17"/>
  
  <!-- Rotor circles (propellers) -->
  <circle cx="4" cy="7" r="2.5" stroke-width="1.5"/>
  <circle cx="20" cy="7" r="2.5" stroke-width="1.5"/>
  <circle cx="4" cy="17" r="2.5" stroke-width="1.5"/>
  <circle cx="20" cy="17" r="2.5" stroke-width="1.5"/>
  
  <!-- Rotor center dots -->
  <circle cx="4" cy="7" r="0.5" fill="currentColor" stroke="none"/>
  <circle cx="20" cy="7" r="0.5" fill="currentColor" stroke="none"/>
  <circle cx="4" cy="17" r="0.5" fill="currentColor" stroke="none"/>
  <circle cx="20" cy="17" r="0.5" fill="currentColor" stroke="none"/>
  
  <!-- Camera/gimbal -->
  <circle cx="12" cy="14" r="1" fill="currentColor" stroke="none"/>
</svg>


